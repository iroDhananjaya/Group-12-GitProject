<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Shopping Cart</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/Group-12-GitProject/cssFiles/headRibbon.css">
        <link rel="stylesheet" href="/Group-12-GitProject/cssFiles/shoppingCart.css">
    </head>
    <body>
        <header id="headRibbon">
            <div id="logo">
                <img src="/Group-12-GitProject/pictures/logoImg.png" alt="logoImg.png">
                <h1>VAULT GAMES</h1>
            </div>
            <nav id="headMenu" aria-label="Main navigation">
                <div id="storeBtn">Store</div>
                <div id="discoverBtn">Discover</div>
                <div id="wishlistBtn">Wishlist</div>
            </nav>
            <div id="searchBar">
                <img src="/Group-12-GitProject/pictures/search.png" class="menuIcons" alt="">
                <input type="search" id="searchBox" placeholder="Search games, games, and more">
            </div>
            <div id="cartAndAccount">
                <div class="accountAction">
                    <img src="/Group-12-GitProject/pictures/cart.png" class="menuIcons" alt="">
                    <span>Cart</span>
                </div>
                <div class="accountAction">
                    <img src="/Group-12-GitProject/pictures/userIcon.png" class="menuIcons" alt="">
                    <span>Sign in</span>
                </div>
            </div>
        </header>
    </body>
</html>
